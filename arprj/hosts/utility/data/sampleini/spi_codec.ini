[flash]
type=spi
size=0x4000000

[upgrade]
compress=y
version=sirius-0.0.0.1

[romcode]
size=0x10000
path=./output/image/boot.bin
upgrade=y

[bootloader]
size=0x80000
path=./output/image/troot_spl.nonsec.img
upgrade=y

[partition0]
name=env
path=./output/image/env.img
part1_ofs=0x4000
path1=./output/image/cfg-data.dtb
size=0x10000
upgrade=y
dual_part=y

[partition2]
name=optee
path=./output/image/optee.img
size=0x40000
upgrade=y
dual_part=y

[partition4]
name=uboot
path=./output/image/uboot.nonsec.img
size=0x80000
upgrade=y
dual_part=y

[partition6]
name=kernel
path=./output/image/kernel.img
size=0x700000
upgrade=y

[partition7]
name=dtb
path=./output/image/artosyn-board.dtb
size=0x10000
upgrade=y

[partition8]
name=userapp
path=./output/all_rootfs.jffs2
size=0xd00000
upgrade=y

[partition13]
name=a7_rtos
path=./output/image/a7_rtos.nonsec.img
size=0x800000
upgrade=y


