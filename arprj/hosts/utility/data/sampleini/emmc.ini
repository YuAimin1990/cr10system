[flash]
type=emmc
size=0x4000000

[upgrade]
compress=y
version=sirius-0.0.0.1

[bootloader]
size=0x80000
path=./output/image/troot_spl.nonsec.img
upgrade=y

[partition0]
name=env
path=./output/image/env.img
part1_ofs=0x4000
path1=./output/image/cfg-data.dtb
size=0x80000
upgrade=y
dual_part=y

[partition2]
name=optee
path=./output/image/optee.img
size=0x80000
upgrade=y
dual_part=y

[partition4]
name=uboot
path=./output/image/uboot.nonsec.img
size=0x80000
upgrade=y
dual_part=y

[partition6]
name=kernel
path=./output/image/kernel.img
size=0x780000
upgrade=y

[partition7]
name=dtb
path=./output/image/artosyn-board.dtb
size=0x80000
upgrade=y

[partition8]
name=userapp
path=./output/all_rootfs.ext4
size=0x6400000
upgrade=y

[partition9]
name=ceva0
path=./output/image/ceva0.nonsec.img
upgrade=y

[partition10]
name=ceva1
path=./output/image/ceva1.nonsec.img
upgrade=y
