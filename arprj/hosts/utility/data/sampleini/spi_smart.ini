[flash]
type=spi
size=0x4000000

[upgrade]
compress=y
version=sirius-0.0.0.1

[romcode]
size=0x10000
path=./output/image/boot.bin
upgrade=n

[bootloader]
size=0x80000
path=./output/image/troot_spl.nonsec.img
upgrade=y

[partition0]
name=factory
size=0x200000

[partition1]
name=env
path=./output/image/env.img
part1_ofs=0x4000
path1=./output/image/cfg-data.dtb
size=0x10000
upgrade=y
dual_part=y

[partition3]
name=optee
path=./output/image/optee.img
size=0x40000
upgrade=y
dual_part=y

[partition5]
name=uboot
path=./output/image/uboot.nonsec.img
size=0x80000
upgrade=y
dual_part=y

[partition7]
name=kernel
path=./output/image/kernel.img
size=0x800000
upgrade=y

[partition8]
name=dtb
path=./output/image/artosyn-board.dtb
size=0x10000
upgrade=y

[partition9]
name=userapp
path=./output/all_rootfs.squashfs
upgrade=y

[partition10]
name=ceva0
path=./output/image/ceva0.nonsec.img
size=0x460000
upgrade=y

[partition11]
name=ceva1
path=./output/image/ceva1.nonsec.img
size=0x460000
upgrade=y

[partition12]
name=a7_rtos
path=./output/image/a7_rtos.nonsec.img
size=0x300000
upgrade=y

[partition13]
name=usr_data
path=./output/usr_data.jffs2
size=0x100000
upgrade=y

