[flash]
type=nand
size=0x8000000
block_size=0x20000
page_size=2048

[upgrade]
compress=y
version=sirius-0.0.0.1

[bootloader]
path=release/prebuilds/uboot/troot_spl.nonsec.img
size=0x40000
upgrade=y

[partition0]
name=vendor
path=release/prebuilds/uboot/vendor.img
size=0x80000
upgrade=y

[partition1]
name=factory
size=0x80000

[partition2]
name=env
path=release/prebuilds/uboot/u-boot-env
size=0x60000
upgrade=y
dual_part=y

[partition3]
name=uboot
path=release/prebuilds/uboot/uboot.nonsec.img
size=0xc0000
upgrade=y
dual_part=y

[partition4]
name=kernel
path=release/prebuilds/kernel/kernel.img
size=0x800000
upgrade=y

[partition5]
name=dtb
path=release/prebuilds/kernel/artosyn-kernel.dtb
size=0x60000
upgrade=y

[partition6]
name=userapp
path=release/prebuilds/fs/all_rootfs.squashfs
size=0x3000000
upgrade=y

[partition7]
name=usr_data
path=release/prebuilds/fs/usr_data.ubifs
size=0x3000000
upgrade=y
