//-----------------------------------------------------------------------
// HPI Interrupt Mapping
//
// Each Application (eg Secure Boot, Secure storage, HDCP TX, ...) requires a
// 1 byte 'APP_UID' (application ID) which is unique per applications. This is
// defined in troot_base_config.cfg. If no GPIO is assigned to this
// application ID an HPI interrupt must be assigned the application ID here.
// It acceptable to assign both a GPO and HPI interrupt to the app ID. This
// binds the application instance to an interrupt.
//
// The assignments are as follows:
// [0..12] - the unique AUID (Application ID)
// [-1]    - unused
//
// Note: [HPI_INT_0], [HPI_INT_1], [HPI_INT_2] are reserved for the
// system and may not be used.
[HPI_INT_3]
-1

[HPI_INT_4]
1

[HPI_INT_5]
-1

[HPI_INT_6]
-1

[HPI_INT_7]
-1

[HPI_INT_8]
-1

[HPI_INT_9]
-1

[HPI_INT_10]
-1

[HPI_INT_11]
-1

[HPI_INT_12]
-1

[HPI_INT_13]
-1

[HPI_INT_14]
-1

[HPI_INT_15]
-1


