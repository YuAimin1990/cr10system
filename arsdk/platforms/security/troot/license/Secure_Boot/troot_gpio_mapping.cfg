//-----------------------------------------------------------------------
// TROOT GPIO configuration.
//-----------------------------------------------------------------------

//
// GPI_MAX_PINS
//
// Maximum General Input Pins (GPI) for TROOT configuration
[GPI_MAX_PINS]
16

// GPO_MAX_PINS
//
// Maximum General Purpose Output (GPO) Pins for TROOT configuration
[GPO_MAX_PINS]
32

//-----------------------------------------------------------------------
// General Purpose Input Pins
//
// Each application (eg Secure Boot, Secure Storage, HDCP TX, ...) requires a
// 1 byte 'APP_UID' (application ID) which is unique per application. This is
// defined in troot_base_config.cfg. Here we assign an input pin to the
// application, binding it to the applicaiton ID, which can function as a start
// signal to triger the application.
//
// Note: [GPI_1] is reserved to indicate high or low CPU frequency
// [0..12] - the unique AUID (application ID)
// [-1]    - unused

[GPI_0]
1

[GPI_1]
99

[GPI_2]
99

[GPI_3]
99

[GPI_4]
-1

[GPI_5]
-1

[GPI_6]
-1

[GPI_7]
-1

[GPI_8]
-1

[GPI_9]
-1

[GPI_10]
-1

[GPI_11]
-1

[GPI_12]
-1

[GPI_13]
-1

[GPI_14]
-1

[GPI_15]
-1

//-----------------------------------------------------------------------
// General Purpose Output Pins
//
// Each application requires a 1 byte 'APP_UID' (application ID) which is
// unique per application. This is defined in troot_base_config.cfg. Here we
// assign/bind an application, using it's ID, to a GPO pin. An assignment must
// be made if an HPI interrupt is not assigned to the application ID.
// Assigning both a GPO and an HPI interrupt is acceptable. Secure boot
// requires two pins assigned (the lower number will be the pass signal and
// the higher number pin the fail signal). Secure storage is not available at
// this time with GPIOs.
//
// [0..12] - the unique AUID (application ID)
// [-1]    - unused
//
// Note: [GPO_0],[GPO_0_DEFAULT_STATE] is reserved to indicate a system boot
[GPO_1]
1

[GPO_2]
1

[GPO_3]
99

[GPO_4]
-1

