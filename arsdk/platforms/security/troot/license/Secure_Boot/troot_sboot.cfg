// 4 byte:
// (in milliseconds)
// This is the time the software will wait for the DMA controller to complete
// a transaction before timing out.
[SB_DMA_REQUEST_TIMEOUT]
1000

// 2 byte:
//
// This is the total number of requests which will be made after a timeout
// occurs. If this number is exceeded then an authentication error is returned.
[SB_DMA_REQUEST_ATTEMPTS]
3

