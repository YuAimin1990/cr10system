//=======================================================================
// Customer Modifed Parameters
// The parameters in this section can be modified for product customization.
// Default values are provided but should be reviewed.

// CPU_FREQ - CUSTOMER PARAMETER
// The CPU_FREQ sets the frequency for the clock input
// and represents the CPU clock frequency in KHZ
//
// CPU_FREQ is set when GPIO_1 is low
// Refer to CPU_HIGH_FREQ for setting the clock input to high frequency

[CPU_FREQ]
150000

// CPU_HIGH_FREQ - CUSTOMER PARAMETER
// The CPU_HIGH_FREQ sets the frequency for the clock input
// and represents the CPU clock frequency in KHZ
//
// CPU_HIGH_FREQ is set when GPIO_1 is high.
// Refer to CPU_FREQ for setting the clock input to low frequency

[CPU_HIGH_FREQ]
150000

// LOGGING_MODE - CUSTOMER PARAMETER
// The LOGGING_MODE enables and disables logging.
//
// 0 - OFF (no logging)
// 1 - ON
[LOGGING_MODE]
1

// LOGGING_LEVEL - CUSTOMER PARAMETER
// The LOGGING_LEVEL determines the level of the log output.
// Note:  The LOGGING_LEVEL applies only if the LOGGING_MODE is turned on.
//
// 0 - Minimal logging
// 1 - Normal logging (DEFAULT)
// 2 - Verbose logging
// 3 - Debug logging
[LOGGING_LEVEL]
1

// RESEED_TIMEOUT - CUSTOMER PARAMETER
// The RESEED_TIMEOUT specifies the time the ESM will wait for the TRNG to
// supply a new nonce before reporting an error
//
// (in milliseconds)
// represents the MINIMUM time required to wait to reseeding operation
// Note:
//  - this time is approximation
//  - MAXIMUM time can be approximately RESEED_TIMEOUT + SHARED_TIMER
//  - this timeout is tied to SHARED_TIMER must be equal to or integral of)
[RESEED_TIMEOUT]
1000

// RESEED_AUTO_INTERVAL - CUSTOMER PARAMETER
// The RESEED_AUTO_INTERVAL specifies the period for the ESM to query the TRNG for a new nonce.
//
// (in seconds)
// represents the time before next AUTO reseed operation
// - multiplication factor against the SHARED_TIMER
//   (i.e. SHARED_TIMER x RESEED_AUTO_INTERVAL = auto reseed interval)
// - range includes [1...65536]
// - a ZERO indicates to support Manual RESEED operation
[RESEED_AUTO_INTERVAL]
600

// AUTO_LOAD_APPS - CUSTOMER PARAMETER
// AUTO_LOAD_APPS enables the application dynamic loading
// 0 - Disabled
// 1 - Enabled

[APPS_DYNAMIC_LOADING]
0

// SDC_HIGH_MEM_SIZE - CUSTOMER PARAMETER
// SDC_HIGH_MEM_SIZE specifies high secure data size in kb
// SDC_HIGH_MEM_SIZE is set :
//                       GPIO_3 is high
//                       SDC_HIGH_MEM_SIZE > sdc_low_mem_size
// MAX value = 512

[SDC_HIGH_MEM_SIZE]
128

// SDC_HIGH_STACK_SIZE - CUSTOMER PARAMETER
// SDC_HIGH_STACK_SIZE specifies high secure stack size in kb
// SDC_HIGH_STACK_SIZE is set :
//                       GPIO_3 is high
//                       SDC_HIGH_MEM_SIZE > sdc_low_mem_size

[SDC_HIGH_STACK_SIZE]
24

// SPACC_INTERNAL_MEMORY_ADDRESS - CUSTOMER PARAMETER
// SPACC_INTERNAL_MEMORY_ADDRESS dedicates 16MBytes of virtual address space to the tRoot
// Note:  This address space is for tRoot virtual internal memory.  Any Source or Destination
//        addresses starting with these 8 bits will be rejected by the Application for
//        commands requiring external tRoot memory access.
//
// uint8_t value
[SPACC_INTERNAL_MEMORY_ADDRESS]
0xfe


//=======================================================================
// Factory Product Settings
// The parameters in this section are the factory settings to enable
// the functionality based on the product purchased.
// These parameters should not be changed.

// MEM_DUMP - DO NOT MODIFY
//
// Boot Flag (1 = dump control information to memory,
//            0 = do not dump control information to memory)
[MEM_DUMP]
1

// CTRL_FLAG0 - DO NOT MODIFY
//
// Control Flag 0
// Hexidecimal format (i.e. AABBCCDD --or-- aabbddcc)
//
// Bit Definitions
// ---------------
// ffffffff: reserved
[CTRL_FLAG0]
0x00000000

// CTRL_FLAG1 - DO NOT MODIFY
//
// Control Flag 1
// Hexidecimal format (i.e. AABBCCDD --or-- aabbddcc)
//
// Bit Definitions
// ---------------
// 00000001: reserved
// 00000002: disable Watchdog
// 00100000: use [HOST_RW_AREA] to set external memory firmware read/write area start address
[CTRL_FLAG1]
0x00000000

// SHARED_TIMER - DO NOT MODIFY
//
// (in milliseconds)
// System Shared Timer
[SHARED_TIMER]
1000

// EXCEPTION_MODE - DO NOT MODIFY
//
// 0 - No exception to be printed out
// [1:255] - maximum number of exceptions to be printed (must allocate enough memory space)
[EXCEPTION_MODE]
4

// DMA_TCM_SIZE - DO NOT MODIFY
//
// (in Bytes)
[DMA_TCM_SIZE]
4096

// TOTAL_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
// The maximum external, contiguous memory size available to tRoot
[TOTAL_MEMORY_SIZE]
16384

// MEMORY_START_OFFSET - DO NOT MODIFY
//
// (in Bytes)
// Offset relative to the programmed memory location
[MEMORY_START_OFFSET]
0

// CONFIG_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
// The maximum memory size available for configuration data
[CONFIG_MEMORY_SIZE]
1160

// MB_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
// The maximum memory for additional mailbox data
[MB_MEMORY_SIZE]
0

// GPIO_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
// HDCP GPI are 4 bits system + 4 bits per port
// HDCP GPO are 4 bits system + 16 bits per port
// The maximum memory for GPIO (output only) data
[GPIO_MEMORY_SIZE]
16

// EXCEPT_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
// 10 Bytes  + (APP_NUM + 1)*(8 Bytes + 20 Bytes + (EXCEPTION_MODE * 28 Bytes))
[EXCEPT_MEMORY_SIZE]
1024


// LOG_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
[LOG_MEMORY_SIZE]
8192

// SYSINFO_MEMORY_SIZE - DO NOT MODIFY
//
// (in Bytes)
// 12 Bytes + ((APP_NUM + 1) * 50 Bytes)
[SYSINFO_MEMORY_SIZE]
512

// APP_NUM - DO NOT MODIFY
//
// Number of Applications supported
[APP_NUM]
1

// HOST_RW_AREA - DO NOT MODIFY
//
// External memory firmware read/write area start address
// 0xffffffff means address is provided by hostlib
[HOST_RW_AREA]
0xffffffff

// PWR_UPDATE_TIMEOUT - DO NOT MODIFY
// The PWR_UPDATE_TIMEOUT specifies the period for the ESM to wait during a HPI powerupdate command before reporting a Timeout Failure
//
// (in milliseconds)
// represents the time before giving up on waiting for powerupdate event to succeed for all troot apps
// - range includes [0...65536]
[PWR_UPDATE_TIMEOUT]
3000

// List of application UIDs that can be initialized when running in low memory
// Decimal value expected delinited with ; no whitespace
[LIST_OF_LOWMEM_AUIDS]


//////////////////////////////////////////////////////////////////////////////////////////////////
//
// Application Partition
// - Each application can be appended to the bottom of this configuration
// - You may copy/paste remove from the secure boot and secure storage example provided here
// - secure boot is type 0x02 and secure storage is 0x01.
// - Each must be given a unique application ID between 0 and 12. In this way multiple instances
//   are allowed.
/////////////////////////////////////////////////////////////////////////////////////////////////

// APP_TYPE_0 - DO NOT MODIFY
//
// [0, 2^16-1]
// Application Type 0x00f Secure Boot
[APP_TYPE_0]
2

// APP_UID_0 - DO NOT MODIFY
//
// [0, 2^8-1]
// Application Unique Identifier
[APP_UID_0]
1

// APP_LIB_0 - DO NOT MODIFY
//
// 256 byte string:
[APP_LIB_0]
./troot_sboot_cfg.so


// APP_CFG_0 - DO NOT MODIFY
//
// 256 byte string:
[APP_CFG_0]
./config/troot_sboot.cfg


