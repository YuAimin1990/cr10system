// SAP_KEY_TYPE.
// Type of generated and processed key pairs.
//
// 1 - SAP_KEY_INFO_TYPE_RSA_INTEG_SSA_PSS_CIPH_AES_OAEP
// 2 - SAP_KEY_INFO_TYPE_ECC_INTEG_ECDSA_CIPH_ECIES
[SAP_KEY_TYPE]
1

// SAP_KEY_SIZE.
// Bits size of generated and processed key pairs.
//
// 2048, 3072, 4096 - SAP_KEY_INFO_TYPE_RSA
// 256, 384, 521    - SAP_KEY_INFO_TYPE_ECC
[SAP_KEY_SIZE]
3072

// SAP_KEY_RSA_EXPONENT
// Public exponent value of of an RSA key type.
//
// Only 65537 is supported.
[SAP_KEY_RSA_EXPONENT]
65537

// SAP_CERT_VERSION_MAJOR.
// XCERT certificate format version major.
//
[SAP_CERT_VERSION_MAJOR]
0

// SAP_CERT_VERSION_MINOR.
// XCERT certificate format version minor.
//
[SAP_CERT_VERSION_MINOR]
1

// SAP_CERT_PCP.
// XCERT permited certificate policies.
//
// Hexadecimal format.
//
// Bit-field definitions.
// ------------------------
// 0x01 - SAP_CERT_PCP_CA. Root certificate has only SAP_CERT_PCP_CA.
// 0x02 - SAP_CERT_PCP_S. Sub certificate must have SAP_CERT_PCP_CA and SAP_CERT_PCP_S.
// 0x04 - SAP_CERT_PCP_IA. Leaf certificate must have SAP_CERT_PCP_IA.
// 0x08 - SAP_CERT_PCP_KE. Leaf certificate can have SAP_CERT_PCP_KE.
// 0x10 - SAP_CERT_PCP_CS.
[SAP_CERT_PCP]
0x01

// SAP_CERT_PAP_ENABLE.
// Enable XCERT permited application policies.
//
// 1 - Enable
// 0 - Disable (Policies are ignored, like for a Root or Sub level certificate.)
[SAP_CERT_PAP_ENABLE]
0

// SAP_CERT_VALID_ENABLE.
// Enable XCERT period validity.
//
// 1 - Enable
// 0 - Disable (Validity is permanent.)
[SAP_CERT_VALID_ENABLE]
1

// SAP_CERT_VALID_NB.
// Not before valid period.
//
// String date format "%H:%M:%S %Y-%m-%d".
//
// A valid period can't be before 00:00:00 January 1, 2017 and after 06:28:14 February 07, 2153.
[SAP_CERT_VALID_NB]
00:00:00 2017-01-01

// SAP_CERT_VALID_NA.
// Not after valid period.
//
// String date format "%H:%M:%S %Y-%m-%d".
//
// A valid period can't be before 00:00:00 January 1, 2017 and after 06:28:14 February 07, 2153.
[SAP_CERT_VALID_NA]
05:06:07 2018-09-10
